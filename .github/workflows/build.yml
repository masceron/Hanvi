name: Build Hanvi

on:
  push:
    branches: [ "master", "main" ]

permissions:
  contents: write

env:
  QT_VERSION: '6.12.0'
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt_host: windows
            qt_arch: win64_llvm_mingw
            artifact: windows
          - os: ubuntu-latest
            qt_host: linux
            qt_arch: linux_gcc_64
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        aqtsource: ${{ env.AQT_SOURCE }}

    - name: Install LLVM-MinGW
      if: runner.os == 'Windows'
      run: |
        curl -L -o llvm-mingw.zip https://github.com/mstorsjo/llvm-mingw/releases/download/nightly/llvm-mingw-nightly-ucrt-x86_64.zip
        7z x llvm-mingw.zip -o"C:\" -y
        echo "C:\llvm-mingw-nightly-ucrt-x86_64\bin" >> $env:GITHUB_PATH

    # Clang builds against the runner's libstdc++, so the archive runs on
    # distributions at least as new as ubuntu-latest.
    - name: Install LLVM
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build 7zip libgl-dev libegl-dev libxkbcommon-dev
        curl -sSfL -o llvm.sh https://apt.llvm.org/llvm.sh
        sudo bash llvm.sh
        ls -d /usr/lib/llvm-*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"

    - name: Configure CMake
      run: cmake -B build -S . -G "Ninja" -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release -j 16

    - name: Create Portable Archive
      run: cmake --build build --target MakePortableZip --config Release -j 16

    - name: Upload Archive
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: build/Hanvi.7z

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Download Archives
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: Name Archives
      run: |
        mv dist/windows/Hanvi.7z dist/Hanvi-windows-x64.7z
        mv dist/linux/Hanvi.7z dist/Hanvi-linux-x64.7z

    - name: Update Nightly Tag
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        # Force create/update the tag locally
        git tag -fa nightly -m "Hanvi"
        git push -f origin nightly

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: Hanvi
        body: "Latest automatic build of Hanvi."
        files: |
          dist/Hanvi-windows-x64.7z
          dist/Hanvi-linux-x64.7z
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

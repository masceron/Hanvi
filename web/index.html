<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1c1b22" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Hanvi</title>
    <script>
      // Applies the saved theme before first paint (appearance.ts does the rest once React loads).
      try {
        var theme = JSON.parse(localStorage.getItem('hanvi.appearance') || 'null')?.theme
        var meta = { sepia: '#e6d8be', light: '#f1f2f6' }[theme]
        if (meta) {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').content = meta
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
